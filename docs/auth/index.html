<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-R//MTnNViwCmcSqszJ3lYJVb7VRByAluWmEpyIvVWhU='; style-src 'unsafe-inline'; img-src 'self';">
  <title>Memomancer · Iniciar sesión</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1a1240; color: #f0efec; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 420px; padding: 28px; text-align: center; }
    img { width: 96px; height: 96px; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    p { color: #c3c2b7; margin: 0 0 18px; }
    a.btn { display: inline-block; background: #8f6cf0; color: #fff; text-decoration: none; font-weight: 600; padding: 12px 22px; border-radius: 12px; }
    .hide { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="../icon.svg" alt="">
    <h1 id="title">Volviendo a Memomancer…</h1>
    <p id="text">Un momento.</p>
    <a id="back" class="btn hide" href="#">Volver a Memomancer</a>
  </main>
  <script>
    // Página puente del inicio de sesión con Google. Google deja aquí el id_token (en el
    // fragmento #, que nunca llega a ningún servidor) y esta página se lo pasa a la app:
    //   - escritorio: al servidor local temporal de la app en 127.0.0.1:<puerto>
    //   - Android: a la app con app.memomancer://auth (enlace intent://)
    // No guarda nada ni lo envía a ningún otro sitio.
    (function () {
      var hash = new URLSearchParams(location.hash.slice(1));
      var query = new URLSearchParams(location.search);
      var get = function (k) { return hash.get(k) || query.get(k); };
      history.replaceState(null, '', location.pathname); // quita el token de la barra y del historial
      var title = document.getElementById('title');
      var text = document.getElementById('text');
      var back = document.getElementById('back');
      var stateRaw = get('state') || '';
      var state = null;
      try { state = JSON.parse(atob(stateRaw.replace(/-/g, '+').replace(/_/g, '/'))); } catch (e) { state = null; }
      if (!state || (state.p !== 'd' && state.p !== 'a')) {
        title.textContent = 'Enlace no válido';
        text.textContent = 'Abre Memomancer y pulsa «Iniciar sesión con Google» desde Perfil.';
        return;
      }
      var params = new URLSearchParams({ state: stateRaw });
      if (get('id_token')) params.set('id_token', get('id_token'));
      else params.set('error', get('error') || 'unknown');
      var target;
      if (state.p === 'd') {
        var port = Number(state.port);
        if (!(port > 1024 && port < 65536 && Math.floor(port) === port)) { title.textContent = 'Enlace no válido'; text.textContent = ''; return; }
        target = 'http://127.0.0.1:' + port + '/auth?' + params.toString();
        text.textContent = 'Si no pasa nada, pulsa el botón.';
      } else {
        target = 'intent://auth?' + params.toString() + '#Intent;scheme=app.memomancer;package=app.memomancer;end';
        text.textContent = 'Si la app no se abre sola, pulsa el botón.';
      }
      back.href = target;
      back.classList.remove('hide');
      location.replace(target);
    })();
  </script>
</body>
</html>
