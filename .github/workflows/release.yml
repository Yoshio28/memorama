name: Publicar release

# Cuando llega a main una versión nueva (campo "version" de package.json) que aún no tiene
# release, se compila el instalador de Windows y se publica la release vX.Y.Z con su etiqueta.
# También se puede lanzar a mano desde la pestaña Actions (vuelve a subir los archivos).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay versión nueva?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "La release $TAG ya existe; no hay nada que publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Instalar NSIS
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip
      - run: npm ci
        if: steps.ver.outputs.skip != 'true'
      - run: npm test
        if: steps.ver.outputs.skip != 'true'
      - name: Compilar instalador y versión portable
        if: steps.ver.outputs.skip != 'true'
        run: npm run dist:win
      - name: Publicar release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Copia con el nombre antiguo: Memora 1.0.3–1.1.0 busca «Memora-Setup-*.exe» para actualizarse desde la app.
          cp dist/Memomancer-Setup-*.exe "dist/Memora-Setup-${TAG#v}.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Memomancer-Setup-*.exe dist/Memomancer-Portable-*.zip dist/Memora-Setup-*.exe --clobber
          else
            gh release create "$TAG" dist/Memomancer-Setup-*.exe dist/Memomancer-Portable-*.zip dist/Memora-Setup-*.exe \
              --target "$GITHUB_SHA" --title "Memomancer ${TAG#v}" --notes-file .github/release-notes.md
          fi
