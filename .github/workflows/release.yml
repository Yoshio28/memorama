name: Publicar release

# Al subir una etiqueta vX.Y.Z se compila el instalador de Windows y se publica la release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar NSIS
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip
      - run: npm ci
      - run: npm test
      - name: Compilar instalador y versión portable
        run: npm run dist:win
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Memora-Setup-*.exe dist/Memora-Portable-*.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Memora-Setup-*.exe dist/Memora-Portable-*.zip \
              --title "Memora ${GITHUB_REF_NAME#v}" --notes-file .github/release-notes.md
          fi
