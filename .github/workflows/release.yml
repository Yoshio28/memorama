name: Publicar release

# Cuando llega a main una versión nueva (campo "version" de package.json) que aún no tiene
# release, se compila el instalador de Windows y se publica la release vX.Y.Z con su etiqueta;
# después se compila el APK de Android y se añade a esa misma release.
# También se puede lanzar a mano desde la pestaña Actions (vuelve a subir los archivos).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - name: ¿Hay versión nueva?
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" >/dev/null 2>&1 && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "La release $TAG ya existe; no hay nada que publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.ver.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Instalar NSIS
        if: steps.ver.outputs.skip != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nsis zip
      - run: npm ci
        if: steps.ver.outputs.skip != 'true'
      - run: npm test
        if: steps.ver.outputs.skip != 'true'
      - name: Compilar instalador y versión portable
        if: steps.ver.outputs.skip != 'true'
        run: npm run dist:win
      - name: Publicar release
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          # Copia con el nombre antiguo: Memora 1.0.3–1.1.0 busca «Memora-Setup-*.exe» para actualizarse desde la app.
          cp dist/Memomancer-Setup-*.exe "dist/Memora-Setup-${TAG#v}.exe"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Memomancer-Setup-*.exe dist/Memomancer-Portable-*.zip dist/Memora-Setup-*.exe --clobber
          else
            gh release create "$TAG" dist/Memomancer-Setup-*.exe dist/Memomancer-Portable-*.zip dist/Memora-Setup-*.exe \
              --target "$GITHUB_SHA" --title "Memomancer ${TAG#v}" --notes-file .github/release-notes.md
          fi

  android:
    needs: windows
    if: needs.windows.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Preparar la app web para Android
        run: npm run build:mobile
      - name: Clave de firma
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Todas las versiones deben firmarse con la misma clave para poder instalarse encima.
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MEMOMANCER_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compilar APK
        working-directory: android
        env:
          MEMOMANCER_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Añadir el APK a la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.windows.outputs.tag }}
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/Memomancer-${TAG#v}.apk"
          gh release upload "$TAG" "dist/Memomancer-${TAG#v}.apk" --clobber
